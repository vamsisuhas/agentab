[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentab"
version = "0.1.0"
description = "A/B test your coding agent's setup: CLAUDE.md, skills, tools and model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentab = "agentab.cli:main"

[tool.setuptools.packages.find]
include = ["agentab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
